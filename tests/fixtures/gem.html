<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>New Grad Product Engineer</title></head>
<body>
<!-- Synthetic form shaped like a Gem job board (jobs.gem.com): plain <span> captions, unnamed radios, hidden dropzone input. -->
<h1>New Grad Product Engineer</h1>
<form>
  <div>
    <div><span>First name<span> *</span></span><div><div><div><input type="text" value=""></div></div></div></div>
    <div><span>Last name<span> *</span></span><div><div><div><input type="text" value=""></div></div></div></div>
    <div><span>Email<span> *</span></span><div><div><div><input type="text" value=""></div></div></div></div>
    <div><span>LinkedIn URL</span><div><div><div><input type="text" value=""></div></div></div></div>
    <div><span>Resume<span> *</span></span><div><div><div role="presentation" tabindex="0">
      <input accept=".pdf,.doc,.docx" tabindex="-1" type="file" style="display: none;">
      <div><i></i><span>Click to upload or drag and drop here</span></div><em></em></div></div></div></div>
    <div><div><span>Are you graduating from a bachelor's or master's degree program in 2026?<span> *</span></span></div>
      <div><div><div><div>
        <div><input id="q1-yes" type="radio"><label for="q1-yes"><span><div></div></span><div>Yes</div></label><div></div></div>
        <div><input id="q1-no" type="radio"><label for="q1-no"><span><div></div></span><div>No</div></label><div></div></div>
      </div></div></div></div></div>
    <div><div><span>Is your degree in Computer Science?<span> *</span></span></div>
      <div><div><div><div>
        <div><input id="q2-yes" type="radio"><label for="q2-yes"><span><div></div></span><div>Yes</div></label><div></div></div>
        <div><input id="q2-no" type="radio"><label for="q2-no"><span><div></div></span><div>No</div></label><div></div></div>
      </div></div></div></div></div>
    <div><span>Anything else you'd like us to know?</span><div><textarea></textarea></div></div>
  </div>
  <button type="submit">Apply without saving</button>
</form>
</body>
</html>
