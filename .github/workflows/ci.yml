name: CI

on:
  push:
    branches: [main, 'codex/application-queue', 'codex/redesign']
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm run check

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run benchmark
      - run: npm run release:package
      - run: npm run test:release
      - uses: actions/upload-artifact@v4
        with:
          name: job-autofill-review-package
          path: |
            apps/extension/dist/job-autofill-*-chrome-mv3.zip
            apps/extension/dist/job-autofill-*-chrome-mv3.zip.sha256
            apps/extension/dist/release-info.json
            local-data/benchmarks/latest.json
          if-no-files-found: error
